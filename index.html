<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>泰然工具箱 · 常用在线工具</title>
    <meta name="description" content="泰然的常用在线工具。在浏览器里完成日常小事，PDF 转 JPG 支持本地转换、逐页导出与长图拼接。" />
    <link rel="canonical" href="https://tools.tairan.org/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        let mode = 'system';
        try { mode = localStorage.getItem('pdf2img:theme-mode') || mode; } catch {}
        document.documentElement.dataset.theme = mode === 'dark' ||
          (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          ? 'dark' : 'light';
      })();
    </script>
    <link rel="stylesheet" href="/src/home.css" />
  </head>
  <body>
    <header class="catalog-header">
      <a class="site-name" href="/">泰然工具箱</a>
      <a href="https://tairan.org/">泰然的博客 ↗</a>
    </header>
    <main class="catalog-main">
      <section class="catalog-intro" aria-labelledby="page-title">
        <p class="eyebrow">常用在线工具</p>
        <h1 id="page-title">日常小事，<br />打开就能做。</h1>
        <p class="intro-description">一些自己也在用的小工具，让日常操作更简单。</p>
      </section>
      <ul class="tool-grid" aria-label="工具列表">
        <!-- tool-catalog -->
      </ul>
    </main>
    <footer class="catalog-footer">泰然工具箱 · <a href="https://tairan.org/">tairan.org</a></footer>
    <script type="module" src="/src/home.js"></script>
  </body>
</html>
