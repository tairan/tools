<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PDF 转 JPG · 太然工具箱</title><meta name="description" content="在浏览器本地将 PDF 转为 JPG，支持逐页 ZIP 导出和长图拼接，无需上传文件。"><link rel="canonical" href="https://tools.tairan.org/pdf2jpg/"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><!-- theme-boot --><link rel="stylesheet" href="/src/tools/pdf2jpg/style.css"></head><body><!-- site-header -->
<main id="main-content" class="tool-main" tabindex="-1"><nav class="breadcrumbs" aria-label="面包屑"><a href="/" data-i18n="navigation.tools">全部工具</a><span aria-hidden="true">/</span><a href="/#media" data-i18n="extra.category">图片与文档</a></nav><div class="tool-title"><h1 data-i18n="extra.title">PDF 转 JPG</h1><p data-i18n="hero.subtitle">支持逐页导出 ZIP 或拼接长图，全程本地处理。</p></div>
<section id="section-upload"><div class="file-zone" id="drop-zone"><label for="file-input" data-i18n="upload.title">选择你的 PDF 文件</label><input type="file" id="file-input" accept="application/pdf,.pdf"><p data-i18n="upload.subtitle">把文件拖到下方区域，或直接从设备中选择。</p></div></section>
<section id="section-options" hidden><div class="file-info"><div><strong id="info-name"></strong><p id="info-size"></p></div><button type="button" id="btn-reset-file" data-i18n="file.change">重新选择文件</button></div><div class="pdf-options settings"><h2 data-i18n="options.title">选择导出方式与图像质量</h2><div class="settings-fields"><label class="field" for="opt-scale"><span><span data-i18n="options.resolution">清晰度</span><output id="scale-value-display">2×</output></span><input type="range" id="opt-scale" min="1" max="3" step="0.5" value="2"></label><label class="field" for="opt-quality"><span><span data-i18n="options.quality">JPEG 质量</span><output id="quality-value-display">92%</output></span><input type="range" id="opt-quality" min="60" max="100" step="1" value="92"></label></div><label class="check" for="opt-stitch"><input id="opt-stitch" type="checkbox" checked><span data-i18n="options.stitchTitle">拼接为单张图片</span></label><p class="tool-note" data-i18n="options.stitchSubtitle">将所有页面垂直拼接输出为一个 JPG 文件</p><div id="gap-row"><label class="field" for="opt-gap"><span><span data-i18n="options.gap">页间距</span><output id="gap-value-display">40 px</output></span><input id="opt-gap" type="range" min="0" max="200" step="10" value="40"></label></div><button type="button" class="primary" id="btn-convert" data-i18n="actions.convert">转换为 JPG</button></div></section>
<section id="section-progress" hidden><h2 data-i18n="progress.processing">处理中</h2><progress id="pdf-progress" value="0" max="100" aria-label="PDF 转换进度"></progress><p id="progress-page-info" class="tool-note"></p><div class="actions"><button type="button" id="pdf-cancel" data-i18n="extra.cancel">取消处理</button></div></section>
<section id="section-results" hidden><div class="results-toolbar"><h2 id="results-summary"></h2><div class="actions"><button type="button" id="btn-download" class="primary">下载 ZIP</button><button type="button" id="btn-reset" data-i18n="results.convertAnother">继续转换</button><button type="button" id="zip-cancel" data-i18n="extra.cancel" hidden>取消处理</button></div></div><div id="stitch-preview" hidden><img id="stitch-img" alt="拼接结果预览" data-i18n-alt="results.stitchAlt"></div><div id="thumbnail-grid"></div></section>
<p id="tool-status" class="status" role="status" aria-live="polite" aria-atomic="true"></p><p class="tool-note" data-i18n="extra.limits">长图超过浏览器画布能力时，请降低清晰度或选择逐页导出。</p><noscript><p>使用此工具需要启用 JavaScript。</p></noscript></main><footer class="site-footer"><span>太然工具箱</span><span data-i18n="footer.note">所有处理均在你的浏览器中完成，文件不会离开当前设备。</span><a href="https://tairan.org/">tairan.org</a></footer><script type="module" src="/src/tools/pdf2jpg/main.js"></script></body></html>
